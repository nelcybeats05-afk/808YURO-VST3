name: Build Windows VST3
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build VST3
        run: cmake --build build --config Release --target VocalChainPlus_VST3
      - name: Show build output
        shell: powershell
        run: Get-ChildItem -Path build -Recurse -Filter *.vst3 | Select-Object FullName
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: VST3-VocalChain-Plus-Windows
          path: build/VocalChainPlus_artefacts/Release/VST3/**
          if-no-files-found: error
