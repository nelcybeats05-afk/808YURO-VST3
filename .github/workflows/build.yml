name: Build exact 808YURO VST3

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install NuGet
        uses: NuGet/setup-nuget@v2

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Find VST3
        shell: pwsh
        run: |
          $vst3 = Get-ChildItem -Path build -Recurse -Directory -Filter "808YUROExact.vst3" | Select-Object -First 1
          if (-not $vst3) {
            Get-ChildItem -Path build -Recurse | Select-Object FullName | Out-Host
            throw "808YUROExact.vst3 was not found"
          }
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item -Recurse $vst3.FullName "package\808YUROExact.vst3"

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: 808YURO-VST3-WINDOWS-EXACT-UI
          path: package/808YUROExact.vst3
          if-no-files-found: error
